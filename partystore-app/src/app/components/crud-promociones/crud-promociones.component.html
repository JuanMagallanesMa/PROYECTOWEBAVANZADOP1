<section class="promo-form">
  
  <h3> Promociones Exclusivas</h3>

  <fieldset>
    <legend>⭐ Información de la Promoción</legend>
    <div class="form-group">
      <label for="nombre">Nombre del producto:</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>
    <div class="form-group">
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
    </div>
  </fieldset>

  <fieldset>
    <legend>⭐ Detalles de la Promoción</legend>
    <div class="form-group">
      <label for="categoria">Categorías:</label>
      <select id="categoria" name="categoria">
        <option value="1">Seleccionar Todos</option>
        <option value="2">Decoraciones</option>
        <option value="3">Invitaciones</option>
        <option value="4">Disfraces</option>
        <option value="5">Suministro para actividades</option>
        <option value="6">Juegos</option>
    </select>
    </div>
    <div class="form-group">
      <label for="fecha_fin">Fin de Promo:</label>
      <input type="date" id="fecha_fin" name="fecha_fin">
    </div>
  </fieldset>

  <button type="submit">Crear Promoción</button>
</section>
<!-- Tabla de proomociones-->
